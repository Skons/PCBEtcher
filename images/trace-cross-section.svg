<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"
     font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Trace cross-section</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/>
    </marker>
  </defs>

  <!-- background (keeps the drawing readable in dark mode) -->
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#202124">Trace cross-section</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#5f6368">perpendicular to the trace, "Extrude traces / pads" off (recessed trace)</text>

  <!-- PCB with recessed trace (groove): x 350-650, surface y=280, groove bottom y=410 -->
  <path d="M190,280 H350 V410 H650 V280 H810 V470 H190 Z"
        fill="#eef0f2" stroke="#202124" stroke-width="2" stroke-linejoin="miter"/>

  <!-- ridges (outside the trace edges, on the PCB surface) -->
  <rect x="260" y="170" width="90" height="110" fill="#cfe8d5" stroke="#202124" stroke-width="2"/>
  <rect x="650" y="170" width="90" height="110" fill="#cfe8d5" stroke="#202124" stroke-width="2"/>

  <!-- overhangs (ridge extended inward, floating over the trace) -->
  <rect x="350" y="170" width="60" height="110" fill="#e0d0f0" stroke="#202124" stroke-width="2"/>
  <rect x="590" y="170" width="60" height="110" fill="#e0d0f0" stroke="#202124" stroke-width="2"/>

  <!-- part labels -->
  <text x="270" y="365" font-size="15" fill="#5f6368">PCB</text>
  <text x="500" y="350" text-anchor="middle" font-size="15" font-style="italic" fill="#5f6368">Trace (recessed groove)</text>
  <text x="305" y="230" text-anchor="middle" font-size="14" fill="#2d6b40">Ridge</text>

  <!-- extension lines -->
  <g stroke="#888888" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <!-- trace width (below) -->
    <path d="M350,410 V530 M650,410 V530"/>
    <!-- trace depth (left) -->
    <path d="M188,280 H145 M350,410 H145"/>
    <!-- ridge height (right) -->
    <path d="M740,170 H850 M810,280 H850"/>
    <!-- ridge width and overhang (top) -->
    <path d="M260,170 V120 M350,170 V120 M590,170 V120 M650,170 V120"/>
  </g>

  <!-- dimension lines with arrows -->
  <g stroke="#1769aa" stroke-width="1.5" fill="none">
    <path d="M350,520 H650" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M160,280 V410" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M840,170 V280" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M260,125 H350" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M590,125 H650" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <!-- dimension labels -->
  <g font-size="16" font-weight="600" fill="#1769aa">
    <text x="500" y="548" text-anchor="middle">Trace width</text>
    <text x="150" y="350" text-anchor="end">Trace depth</text>
    <text x="856" y="230">Ridge height</text>
    <text x="305" y="112" text-anchor="middle">Ridge width</text>
    <text x="620" y="112" text-anchor="middle">Overhang</text>
  </g>

  <text x="500" y="595" text-anchor="middle" font-size="14" fill="#5f6368">Ridge and overhang have the same height, measured from the PCB surface. Overhang ≤ trace width / 2.</text>
</svg>
